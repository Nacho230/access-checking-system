{% extends "base.html" %}
{% block title %}Chofer{% endblock %}
{% block content %}
<h2 class="mb-4">Datos del Chofer</h2>
<form method="post" class="card card-body">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Nombre Completo *</label>
            <input type="text" name="nombre" class="form-control" value="{{ chofer.nombre if chofer else '' }}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">DNI *</label>
            <input type="text" name="dni" class="form-control" value="{{ chofer.dni if chofer else '' }}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Vencimiento Licencia *</label>
            <input type="date" name="licencia_vencimiento" class="form-control" value="{{ chofer.licencia_vencimiento.strftime('%Y-%m-%d') if chofer else '' }}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Empresa Transporte *</label>
            <select name="empresa_id" class="form-select" required>
                {% for e in empresas %}
                <option value="{{ e.id }}" {% if chofer and chofer.empresa_id==e.id %}selected{% endif %}>{{ e.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input type="text" name="telefono" class="form-control" value="{{ chofer.telefono if chofer else '' }}">
        </div>
        <div class="col-12 mt-4">
            <button class="btn btn-primary" type="submit">Guardar Chofer</button>
            <a href="{{ url_for('choferes_list') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </div>
</form>
{% endblock %}
