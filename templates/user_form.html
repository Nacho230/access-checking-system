{% extends "base.html" %}
{% block title %}{{ 'Editar' if usuario else 'Nuevo' }} usuario{% endblock %}
{% block content %}
<h1 class="mb-3">{{ 'Editar' if usuario else 'Nuevo' }} usuario</h1>
<form method="post" class="row g-3">
  <div class="col-md-4">
    <label class="form-label">Usuario</label>
    <input type="text" name="username" class="form-control" value="{{ usuario.username if usuario else '' }}" {% if usuario %}readonly{% else %}required{% endif %}>
  </div>
  <div class="col-md-4">
    <label class="form-label">Nombre completo</label>
    <input type="text" name="nombre" class="form-control" value="{{ usuario.nombre if usuario else '' }}" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Rol</label>
    <select name="role" class="form-select">
      <option value="operador" {% if usuario and usuario.role=='operador' %}selected{% endif %}>Operador</option>
      <option value="vigilador" {% if usuario and usuario.role=='vigilador' %}selected{% endif %}>Vigilador (Solo Inspección)</option>
      <option value="admin" {% if usuario and usuario.role=='admin' %}selected{% endif %}>Administrador</option>
    </select>
</div>
  <div class="col-md-4">
    <label class="form-label">Contraseña {{ ' (dejar en blanco para no cambiar)' if usuario else '' }}</label>
    <input type="password" name="password" class="form-control" {% if not usuario %}required{% endif %}>
  </div>
  <div class="col-md-4 d-flex align-items-end">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="active" id="active" {% if not usuario or usuario.active %}checked{% endif %}>
      <label class="form-check-label" for="active">Activo</label>
    </div>
  </div>
  <div class="col-12 d-flex gap-2">
    <button class="btn btn-primary" type="submit">{{ 'Actualizar' if usuario else 'Crear' }}</button>
    <a class="btn btn-secondary" href="{{ url_for('usuarios_list') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
