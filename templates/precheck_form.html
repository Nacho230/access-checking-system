{% extends "base.html" %}
{% block title %}Pre-Check Ingreso{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card fade-in-up">
            <div class="card-body p-4">
                <h2 class="h4 mb-3 text-center border-bottom pb-3">🛡️ Control de Acceso</h2>
                <p class="text-muted text-center mb-4">Ingrese los datos para verificar autorización.</p>
                
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">DNI Chofer</label>
                        <input type="text" name="dni" class="form-control form-control-lg" placeholder="Ej: 30123456" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Patente Camión</label>
                        <input type="text" name="patente" class="form-control form-control-lg text-uppercase" placeholder="Ej: AA123BB" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button class="btn btn-primary btn-lg" type="submit">Verificar Estado</button>
                        <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
