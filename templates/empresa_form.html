{% extends "base.html" %}
{% block title %}Empresa{% endblock %}
{% block content %}
<h2 class="mb-4">Datos de Empresa</h2>
<form method="post" class="card card-body">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Razón Social *</label>
            <input type="text" name="nombre" class="form-control" value="{{ empresa.nombre if empresa else '' }}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">CUIT</label>
            <input type="text" name="cuit" class="form-control" value="{{ empresa.cuit if empresa else '' }}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input type="text" name="telefono" class="form-control" value="{{ empresa.telefono if empresa else '' }}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Dirección</label>
            <input type="text" name="direccion" class="form-control" value="{{ empresa.direccion if empresa else '' }}">
        </div>
        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="activa" id="activa" {% if not empresa or empresa.activa %}checked{% endif %}>
                <label class="form-check-label" for="activa">Empresa Activa</label>
            </div>
        </div>
        <div class="col-12 mt-4">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a href="{{ url_for('empresas_list') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </div>
</form>
{% endblock %}
